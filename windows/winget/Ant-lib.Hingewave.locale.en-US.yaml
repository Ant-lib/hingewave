ShortDescription: The iPhone Duo fold animation for your laptop lid, driven by the best available lid angle source.
Description: |-
  Close the lid and the desktop stays anchored in space while the glass tilts over it, blurring and darkening from the hinge outward. Hingewave reads a hinge angle sensor when the laptop has one, the lid accelerometer on convertibles, or falls back to the lid switch with a timed transition. No network, no telemetry.
