name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS and create the release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          [ "$tag" = "$version" ] || { echo "tag $tag does not match VERSION $version" >&2; exit 1; }
      - name: Unit tests
        working-directory: macos
        run: swift test
      - name: Build universal app and zip
        working-directory: macos
        run: ./build.sh --universal --zip
      - name: Golden render check
        run: macos/build/Hingewave.app/Contents/MacOS/Hingewave --render-check "$RUNNER_TEMP/render-check" --core core
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat macos/build/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --title "Hingewave $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            macos/build/Hingewave-mac.zip macos/build/SHA256SUMS.txt

  android:
    name: Build Android and attach the APK
    runs-on: ubuntu-latest
    needs: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore from secrets, if configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
            echo "using release keystore"
          else
            echo "no keystore secret; the APK will be debug signed"
          fi
      - name: Unit tests and release APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
      - name: Attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          cp android/app/build/outputs/apk/release/app-release.apk "hingewave-$version.apk"
          shasum -a 256 "hingewave-$version.apk" > SHA256SUMS-android.txt
          gh release upload "$GITHUB_REF_NAME" "hingewave-$version.apk" SHA256SUMS-android.txt --clobber

  windows:
    name: Build Windows and attach the executables
    runs-on: windows-latest
    needs: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build, test and publish
        shell: pwsh
        run: pwsh windows/build.ps1
      - name: Golden render check on WARP
        shell: pwsh
        run: |
          & windows/build/win-x64/hingewave.exe --render-check "$env:RUNNER_TEMP/render-check" --core core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attach executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME windows/build/hingewave-x64.exe windows/build/hingewave-arm64.exe windows/build/SHA256SUMS-windows.txt --clobber
