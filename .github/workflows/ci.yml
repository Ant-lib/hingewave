name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No long dashes in text files
        run: |
          if git ls-files -z | grep -zvE '\.(png|jks|p12|icns|zip)$' | xargs -0 grep -nP '[\x{2013}\x{2014}]' ; then
            echo "long dashes found; use plain hyphens" >&2
            exit 1
          fi
          echo "no long dashes"

  core:
    name: Reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "core/reference[test]"
      - name: Test
        run: python -m pytest core/reference -q
      - name: Committed fixtures and goldens are current
        working-directory: core/reference
        run: python -m hingewave_ref check

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: hingewave-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-emulator:
    name: Android emulator check
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Golden render check and hinge sweep on the 7.6 inch fold-in profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: 7.6in Foldable
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: android/emulator-check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hingewave-android-emulator
          path: |
            android/build/render-check
            android/build/emulator-shots

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        run: dotnet test windows/Hingewave.Core.Tests --nologo
      - name: Build
        run: dotnet build windows/Hingewave.App -c Release --nologo
      - name: Golden render check on WARP
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/Hingewave.App/bin/Release -Recurse -Filter hingewave.exe | Select-Object -First 1
          & $exe.FullName --render-check "$env:RUNNER_TEMP/render-check" --core core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish single-file executables
        shell: pwsh
        run: pwsh windows/build.ps1 -SkipTests
      - uses: actions/upload-artifact@v7
        with:
          name: hingewave-windows
          path: |
            windows/build/hingewave-*.exe
            windows/build/SHA256SUMS-windows.txt

  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        working-directory: macos
        run: swift test
      - name: Build app bundle
        working-directory: macos
        run: ./build.sh --universal --zip
      - name: Golden render check
        run: |
          macos/build/Hingewave.app/Contents/MacOS/Hingewave --render-check "$RUNNER_TEMP/render-check" --core core
      - uses: actions/upload-artifact@v7
        with:
          name: Hingewave-mac
          path: |
            macos/build/Hingewave-mac.zip
            macos/build/SHA256SUMS.txt
